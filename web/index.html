<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>walroos</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- ponytail: Google Fonts like the prototype; falls back to system fonts offline. Self-host if that matters. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // The last applied theme (src/theme.ts), so the first paint already has its colors.
    try {
      var css = localStorage.getItem('walroos-theme-css');
      if (css) document.documentElement.style.cssText = css;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
