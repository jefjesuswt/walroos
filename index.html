/* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
   Put this @layer first; product CSS outside the layer always wins. */
@layer od-layout {
  :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
  .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
  .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
  .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
  .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
  .od-fill    { flex: 1 1 0; min-width: 0; }
  .od-fixed   { flex: none; }
  .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }
  .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
  :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
  .od-tile { display: grid; grid-template-rows: auto 1fr; }
  :where(.od-tile) > :where(*) { display: block; }
  .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
  .od-media-cover { object-fit: cover; }
  .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .od-clamp-2 { -webkit-line-clamp: 2; }
  .od-clamp-3 { -webkit-line-clamp: 3; }
  .od-lines-2 { min-height: calc(2 * 1.4em); }
  .od-nowrap  { white-space: nowrap; }
  .od-keep    { word-break: keep-all; overflow-wrap: anywhere; }
  .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
  .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }
  .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
             padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
  .od-rail::-webkit-scrollbar { display: none; }
  :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
  :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }
  .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
  .od-touch  { min-width: 44px; min-height: 44px; }
}
/* /OD-LAYOUT-PRIMITIVES v1 */

<style>
/* walroos — arctic design tokens. All values live here; components reference variables only. */
:root {
  --bg: #0B0F14;
  --s1: #111820;
  --s2: #17202A;
  --s3: #1D2834;
  --bd: #1F2A36;
  --bd2: #2B3948;
  --tx: #E6EDF3;
  --tx2: #8B98A5;
  --ac: #5CC8E6;
  --ac-hover: #7AD4EC;
  --ac-tx: #06222B;
  --ac-soft: rgba(92, 200, 230, .12);
  --ok: #3FB950;
  --busy: #D29922;
  --bad: #F85149;
  --idle: #8B98A5;
  --ok-soft: rgba(63, 185, 80, .12);
  --busy-soft: rgba(210, 153, 34, .14);
  --bad-soft: rgba(248, 81, 73, .12);
  --idle-soft: rgba(139, 152, 165, .14);
  --scrim: rgba(3, 6, 10, .64);
  --code-bg: #0E141B;
  --focus: #5CC8E6;

  --f-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs: 14px;
  --fs-md: 16px;
  --fs-lg: 20px;
  --fs-xl: 24px;
  --fs-2xl: 28px;

  --sp1: 4px;
  --sp2: 8px;
  --sp3: 12px;
  --sp4: 16px;
  --sp5: 20px;
  --sp6: 24px;
  --sp8: 32px;
  --sp10: 40px;

  --r1: 6px;
  --r2: 8px;
  --dur: 140ms;
  --dur-out: 90ms;
  --ease-out: cubic-bezier(.2, .7, .3, 1);
  --ease-in: cubic-bezier(.5, 0, .8, .4);

  --sb: 240px;
  --sb-c: 56px;
  --top: 48px;
  --max: 1280px;
  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #F6F8FA;
  --s1: #FFFFFF;
  --s2: #EEF2F5;
  --s3: #E4E9EE;
  --bd: #D8DEE4;
  --bd2: #C2CBD4;
  --tx: #0D1117;
  --tx2: #57606A;
  --ac: #0E7FA0;
  --ac-hover: #0B6B88;
  --ac-tx: #FFFFFF;
  --ac-soft: rgba(14, 127, 160, .10);
  --ok: #1A7F37;
  --busy: #9A6700;
  --bad: #CF222E;
  --idle: #6E7781;
  --ok-soft: rgba(26, 127, 55, .10);
  --busy-soft: rgba(154, 103, 0, .12);
  --bad-soft: rgba(207, 34, 46, .09);
  --idle-soft: rgba(110, 119, 129, .12);
  --scrim: rgba(13, 17, 23, .36);
  --code-bg: #F2F5F8;
  --focus: #0E7FA0;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 400 var(--fs)/1.5 var(--f-ui);
  font-feature-settings: 'cv11', 'ss01';
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.02em; line-height: 1.25; }
h2 { font-size: var(--fs-md); font-weight: 600; letter-spacing: -.01em; line-height: 1.35; }
h3 { font-size: var(--fs); font-weight: 600; line-height: 1.4; }
code, .mono, pre, kbd { font-family: var(--f-mono); font-size: var(--fs-sm); }
code { font-size: .92em; }
.muted { color: var(--tx2); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: var(--sp2); top: -48px; z-index: 100; background: var(--ac); color: var(--ac-tx); padding: var(--sp2) var(--sp3); border-radius: var(--r1); }
.skip:focus { top: var(--sp2); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--ac-soft); }

.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-lg { width: 24px; height: 24px; }
.ico-t { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--sb) minmax(0, 1fr); min-height: 100vh; }
body.sb-collapsed .app { grid-template-columns: var(--sb-c) minmax(0, 1fr); }

.sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: var(--sp2);
  padding: var(--sp3) var(--sp2);
  background: var(--s1); border-right: 1px solid var(--bd);
  overflow-y: auto; overflow-x: hidden;
}
.sb-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp2); padding: 0 var(--sp1) 0 var(--sp2); min-height: 36px; }
.brand { display: flex; align-items: center; gap: var(--sp2); font-weight: 600; font-size: var(--fs-md); letter-spacing: -.02em; }
.brand svg { width: 22px; height: 22px; color: var(--ac); }
.sb-env select { width: 100%; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: var(--sp3);
  height: 32px; padding: 0 var(--sp3); border-radius: var(--r1);
  color: var(--tx2); font-weight: 500;
  transition: background var(--dur) var(--ease-out), color var(--dur) var(--ease-out);
}
@media (hover: hover) { .nav a:hover { background: var(--s2); color: var(--tx); } }
.nav a[aria-current="page"] { background: var(--s2); color: var(--tx); box-shadow: inset 2px 0 0 var(--ac); }
.nav a[aria-current="page"] .ic { color: var(--ac); }
.sb-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--sp2); padding: var(--sp3) var(--sp2) 0; border-top: 1px solid var(--bd); }
.sb-user { display: flex; align-items: center; gap: var(--sp2); min-width: 0; }
.sb-user-t { display: grid; min-width: 0; }
.sb-user-t > * { display: block; }
.avatar { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--s3); border: 1px solid var(--bd2); font-size: var(--fs-xs); font-weight: 600; }
.conn { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--tx2); }
.sb-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--sp2); font-size: var(--fs-xs); color: var(--tx2); }
body.sb-collapsed .lbl, body.sb-collapsed .sb-env { display: none; }
body.sb-collapsed .sb-top { flex-direction: column; padding: 0; }
body.sb-collapsed .nav a { justify-content: center; padding: 0; }
body.sb-collapsed .sb-user, body.sb-collapsed .sb-meta { justify-content: center; }
body.sb-collapsed .sb-foot { padding-inline: 0; align-items: center; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  height: var(--top); display: flex; align-items: center; gap: var(--sp3);
  padding: 0 var(--sp6);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--bd);
}
.crumbs { display: flex; align-items: center; gap: var(--sp2); min-width: 0; flex: 1 1 0; font-size: var(--fs-sm); color: var(--tx2); }
.crumbs ol { display: flex; align-items: center; gap: var(--sp2); list-style: none; margin: 0; padding: 0; min-width: 0; }
.crumbs li { display: flex; align-items: center; gap: var(--sp2); min-width: 0; white-space: nowrap; }
.crumbs li + li::before { content: '/'; color: var(--bd2); }
.crumbs li:last-child { color: var(--tx); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
@media (hover: hover) { .crumbs a:hover { color: var(--tx); } }
.search-btn {
  display: flex; align-items: center; gap: var(--sp2);
  height: 32px; width: 280px; padding: 0 var(--sp2) 0 var(--sp3);
  background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r1);
  color: var(--tx2); cursor: pointer; text-align: left;
}
.search-btn span { flex: 1 1 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
@media (hover: hover) { .search-btn:hover { border-color: var(--bd2); color: var(--tx); } }
kbd { font-size: 11px; padding: 1px 6px; border: 1px solid var(--bd2); border-radius: 4px; color: var(--tx2); background: var(--s2); white-space: nowrap; }
.menu-btn { display: none; }

#view { outline: none; flex: 1 1 auto; }
.content { width: 100%; max-width: var(--max); margin: 0 auto; padding: var(--sp5) var(--sp6) var(--sp8); display: flex; flex-direction: column; gap: var(--sp4); }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp4); flex-wrap: wrap; }
.ph-text { display: grid; gap: var(--sp1); min-width: 0; }
.ph-text > * { display: block; }
.ph-actions { display: flex; gap: var(--sp2); flex-wrap: wrap; }
.ph-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp2) var(--sp4); color: var(--tx2); font-size: var(--fs-sm); }
.ph-meta > * { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.title-row { display: flex; align-items: center; gap: var(--sp3); flex-wrap: wrap; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 var(--sp3);
  background: var(--s2); border: 1px solid var(--bd2); border-radius: var(--r1);
  font-weight: 500; font-size: var(--fs-sm); white-space: nowrap; cursor: pointer;
  transition: background var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out);
}
@media (hover: hover) { .btn:hover { background: var(--s3); border-color: var(--tx2); } }
.btn-primary { background: var(--ac); border-color: var(--ac); color: var(--ac-tx); }
@media (hover: hover) { .btn-primary:hover { background: var(--ac-hover); border-color: var(--ac-hover); } }
.btn-danger { color: var(--bad); }
@media (hover: hover) { .btn-danger:hover { border-color: var(--bad); background: var(--bad-soft); } }
.btn-ghost { background: transparent; border-color: transparent; }
@media (hover: hover) { .btn-ghost:hover { background: var(--s2); border-color: var(--bd); } }
.btn-sm { height: 28px; padding: 0 var(--sp2); font-size: var(--fs-xs); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; pointer-events: none; }
.btn-icon {
  display: inline-grid; place-items: center; flex: none;
  width: 32px; height: 32px; border-radius: var(--r1);
  background: transparent; border: 1px solid transparent; color: var(--tx2); cursor: pointer;
  transition: background var(--dur) var(--ease-out), color var(--dur) var(--ease-out);
}
@media (hover: hover) { .btn-icon:hover { background: var(--s2); color: var(--tx); border-color: var(--bd); } }
.btn-icon.copied { color: var(--ok); }
.split { display: inline-flex; }
.split > .btn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.split > .menu > summary.btn { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left-color: color-mix(in srgb, var(--ac-tx) 25%, var(--ac)); padding: 0 var(--sp2); }

input[type=text], input[type=url], input[type=search], input[type=password], input:not([type]), select, textarea {
  height: 32px; padding: 0 var(--sp3);
  background: var(--s1); border: 1px solid var(--bd2); border-radius: var(--r1);
  font-size: var(--fs-sm); min-width: 0;
  transition: border-color var(--dur) var(--ease-out);
}
textarea { height: auto; padding: var(--sp2) var(--sp3); line-height: 1.5; resize: vertical; font-family: var(--f-mono); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 3px var(--ac-soft); }
input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color: var(--bad); }
input::placeholder, textarea::placeholder { color: var(--tx2); opacity: .7; }
input.mono, textarea.mono { font-family: var(--f-mono); }
input[type=checkbox], input[type=radio] { accent-color: var(--ac); width: 16px; height: 16px; margin: 0; }
.form { display: flex; flex-direction: column; gap: var(--sp4); }
.field { display: grid; gap: 6px; min-width: 0; }
.field > * { display: block; }
.field > input, .field > select, .field > textarea { width: 100%; }
.field label, .label { font-size: var(--fs-sm); font-weight: 500; }
.req { color: var(--bad); }
.help { font-size: var(--fs-xs); color: var(--tx2); }
.err { font-size: var(--fs-xs); color: var(--bad); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp3); }
.check { display: flex; align-items: center; gap: var(--sp2); font-size: var(--fs-sm); cursor: pointer; }
.disclosure { border: 1px solid var(--bd); border-radius: var(--r2); }
.disclosure > summary { cursor: pointer; padding: var(--sp2) var(--sp3); font-size: var(--fs-sm); font-weight: 500; list-style: none; display: flex; align-items: center; gap: var(--sp2); }
.disclosure > summary::-webkit-details-marker { display: none; }
.disclosure > summary::before { content: ''; width: 6px; height: 6px; border-right: 1.5px solid var(--tx2); border-bottom: 1.5px solid var(--tx2); transform: rotate(-45deg); transition: transform var(--dur) var(--ease-out); }
.disclosure[open] > summary::before { transform: rotate(45deg); }
.disclosure > div { padding: 0 var(--sp3) var(--sp3); }

/* ---------- surfaces ---------- */
.card { background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r2); }
.card-pad { padding: var(--sp3); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp3); padding: var(--sp2) var(--sp3); border-bottom: 1px solid var(--bd); min-height: 40px; }
.card-head h2 { font-size: var(--fs); }
.card-head .muted { font-size: var(--fs-xs); }
.card-head > div { display: grid; gap: 2px; min-width: 0; }
.card-head > div > * { display: block; }
.card-body { padding: var(--sp3); display: flex; flex-direction: column; gap: var(--sp2); }
.section { display: flex; flex-direction: column; gap: var(--sp3); }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp3); }
.cols-2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: var(--sp4); align-items: start; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--sp3); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp3); }
.span-2 { grid-column: 1 / -1; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 var(--sp2); border: 1px solid var(--bd2); border-radius: 4px; font-size: var(--fs-xs); color: var(--tx2); white-space: nowrap; background: var(--s2); }
.chip .ic { width: 12px; height: 12px; }
.chip-ac { color: var(--ac); border-color: color-mix(in srgb, var(--ac) 40%, transparent); background: var(--ac-soft); }
.divider { height: 1px; background: var(--bd); border: 0; margin: 0; }

/* status */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 var(--sp2); border-radius: 999px; font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: currentColor; }
.s-ok { color: var(--ok); background: var(--ok-soft); }
.s-busy { color: var(--busy); background: var(--busy-soft); }
.s-bad { color: var(--bad); background: var(--bad-soft); }
.s-idle { color: var(--idle); background: var(--idle-soft); }
.dot.ok { color: var(--ok); } .dot.bad { color: var(--bad); } .dot.busy { color: var(--busy); } .dot.idle { color: var(--idle); }
.s-busy .dot, .dot.busy { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
.spin { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tag-current { color: var(--ac); background: var(--ac-soft); border: 1px solid color-mix(in srgb, var(--ac) 35%, transparent); border-radius: 4px; font-size: 11px; font-weight: 600; padding: 0 6px; height: 20px; display: inline-flex; align-items: center; letter-spacing: .02em; }

/* banner / alerts */
.alert { display: flex; align-items: center; gap: var(--sp3); padding: var(--sp2) var(--sp3); border: 1px solid var(--bd); border-radius: var(--r2); background: var(--s1); flex-wrap: wrap; }
.alert > .ic { color: var(--tx2); }
.alert-bad { border-color: color-mix(in srgb, var(--bad) 45%, var(--bd)); background: var(--bad-soft); }
.alert-bad > .ic { color: var(--bad); }
.alert-busy { border-color: color-mix(in srgb, var(--busy) 45%, var(--bd)); background: var(--busy-soft); }
.alert-busy > .ic { color: var(--busy); }
.alert-ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--bd)); background: var(--ok-soft); }
.alert-ok > .ic { color: var(--ok); }
.alert-text { flex: 1 1 240px; display: grid; gap: 2px; min-width: 0; }
.alert-text > * { display: block; }
.alert-actions { display: flex; gap: var(--sp2); flex-wrap: wrap; }

/* stat tiles */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp3); }
.stat { padding: var(--sp3); display: grid; gap: 2px; }
.stat-label { font-size: var(--fs-sm); color: var(--tx2); display: flex; align-items: center; gap: 6px; }
.stat-num { font-size: clamp(20px, 1.8vw, 24px); font-weight: 600; letter-spacing: -.03em; line-height: 1.15; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat-num small { font-size: .55em; color: var(--tx2); font-weight: 500; letter-spacing: 0; }
.stat-sub { font-size: var(--fs-xs); color: var(--tx2); }
a.stat { transition: border-color var(--dur) var(--ease-out); }
@media (hover: hover) { a.stat:hover { border-color: var(--bd2); } }

/* meters */
.meter { display: grid; gap: 4px; }
.meter-h { display: flex; justify-content: space-between; gap: var(--sp2); font-size: var(--fs-xs); color: var(--tx2); }
.bar { height: 6px; border-radius: 3px; background: var(--s3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--ac); }
.bar i.b-busy { background: var(--busy); } .bar i.b-bad { background: var(--bad); }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--bd); border-radius: var(--r2); background: var(--s1); }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
.tbl th { text-align: left; font-weight: 500; color: var(--tx2); font-size: var(--fs-xs); padding: var(--sp2) var(--sp3); border-bottom: 1px solid var(--bd); white-space: nowrap; background: var(--s1); }
.tbl td { padding: 6px var(--sp3); border-bottom: 1px solid var(--bd); vertical-align: middle; height: 40px; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background var(--dur) var(--ease-out); }
@media (hover: hover) { .tbl tbody tr:hover { background: var(--s2); } }
.tbl .ta-r { text-align: right; }
.cell-title { display: block; font-weight: 500; color: var(--tx); }
@media (hover: hover) { a.cell-title:hover { color: var(--ac); } }
.cell-sub { display: block; font-size: var(--fs-xs); color: var(--tx2); }
.cell-stack { display: grid; gap: 2px; min-width: 0; }
.cell-stack > * { display: block; }
.row-actions { display: inline-flex; gap: var(--sp1); align-items: center; justify-content: flex-end; opacity: 0; transition: opacity var(--dur) var(--ease-out); }
.tbl tr:hover .row-actions, .tbl tr:focus-within .row-actions, .row-actions:has(details[open]) { opacity: 1; }
@media (hover: none) { .row-actions { opacity: 1; } }
.repo { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 280px; color: var(--tx2); }
.repo span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.link { color: var(--ac); }
@media (hover: hover) { a.link:hover { text-decoration: underline; } }

/* menus */
.menu { position: relative; display: inline-block; }
.menu > summary { list-style: none; cursor: pointer; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-pop {
  position: fixed; z-index: 60; min-width: 200px;
  display: flex; flex-direction: column; padding: var(--sp1);
  background: var(--s2); border: 1px solid var(--bd2); border-radius: var(--r2);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
}
.menu-pop > button, .menu-pop > a { display: flex; align-items: center; gap: var(--sp2); height: 32px; padding: 0 var(--sp2); border: 0; background: none; border-radius: 4px; cursor: pointer; text-align: left; font-size: var(--fs-sm); white-space: nowrap; }
@media (hover: hover) { .menu-pop > button:hover, .menu-pop > a:hover { background: var(--s3); } }
.menu-pop .danger { color: var(--bad); }
.menu-pop form { padding: var(--sp2); display: grid; gap: var(--sp2); width: 280px; }

/* tabs */
.tabs { display: flex; gap: var(--sp1); border-bottom: 1px solid var(--bd); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 var(--sp3); color: var(--tx2); font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color var(--dur) var(--ease-out); }
@media (hover: hover) { .tabs a:hover { color: var(--tx); } }
.tabs a[aria-current="page"] { color: var(--tx); border-bottom-color: var(--ac); }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--s2); border: 1px solid var(--bd); border-radius: var(--r1); }
.seg a, .seg button { height: 26px; padding: 0 var(--sp3); border: 0; border-radius: 4px; background: none; color: var(--tx2); font-size: var(--fs-xs); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; }
.seg [aria-current="page"], .seg [aria-pressed="true"] { background: var(--s1); color: var(--tx); box-shadow: 0 0 0 1px var(--bd2); }

/* code */
.cmd, .code { position: relative; display: flex; align-items: center; gap: var(--sp2); min-width: 0; background: var(--code-bg); border: 1px solid var(--bd); border-radius: var(--r1); }
.cmd { padding: var(--sp1) var(--sp1) var(--sp1) var(--sp3); min-height: 40px; }
.cmd code { flex: 1 1 0; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: var(--fs-sm); scrollbar-width: thin; padding: 6px 0; }
.cmd .prompt { color: var(--tx2); font-family: var(--f-mono); user-select: none; }
.code { align-items: flex-start; }
.code pre { flex: 1 1 0; min-width: 0; margin: 0; padding: var(--sp3); overflow-x: auto; font-size: var(--fs-sm); line-height: 1.6; }
.code .btn-icon { margin: var(--sp1); }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; }
.tl li + li { border-top: 1px solid var(--bd); }
.tl-row { display: flex; align-items: center; gap: var(--sp3); padding: var(--sp2) var(--sp3); transition: background var(--dur) var(--ease-out); }
@media (hover: hover) { .tl-row:hover { background: var(--s2); } }
.tl-main { flex: 1 1 0; min-width: 0; display: grid; gap: 2px; }
.tl-main > * { display: block; }
.tl-top { display: flex !important; align-items: center; gap: var(--sp2); min-width: 0; flex-wrap: wrap; }
.tl-msg { color: var(--tx2); font-size: var(--fs-sm); }
.tl-meta { display: grid; justify-items: end; gap: 2px; flex: none; font-size: var(--fs-xs); color: var(--tx2); }
.tl-meta > * { display: block; white-space: nowrap; }
.sha { font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--ac); }

/* node cards */
.node-cards { display: flex; flex-direction: column; gap: var(--sp2); padding: var(--sp2); }
.node-card { display: grid; gap: var(--sp2); padding: var(--sp2) var(--sp3); border: 1px solid var(--bd); border-radius: var(--r2); background: var(--s1); transition: border-color var(--dur) var(--ease-out); }
@media (hover: hover) { .node-card:hover { border-color: var(--bd2); } }
.node-card.offline { border-color: color-mix(in srgb, var(--bad) 50%, var(--bd)); background: var(--bad-soft); }
.node-card-h { display: flex; align-items: center; justify-content: space-between; gap: var(--sp2); }
.node-card-h > div { display: grid; min-width: 0; }
.node-card-h > div > * { display: block; }

/* apps */
.app-card { display: flex; flex-direction: column; gap: var(--sp2); padding: var(--sp3); cursor: pointer; transition: border-color var(--dur) var(--ease-out); }
@media (hover: hover) { .app-card:hover { border-color: var(--bd2); } }
.ac-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp2); }
.ac-head .cell-title { font-size: var(--fs-md); }
.ac-domain { display: inline-flex; align-items: center; gap: 6px; color: var(--tx2); min-width: 0; max-width: 100%; align-self: flex-start; }
@media (hover: hover) { .ac-domain:hover { color: var(--ac); } }
.ac-last { display: grid; gap: 4px; padding-top: var(--sp2); border-top: 1px solid var(--bd); }
.ac-last > * { display: block; }
.ac-last .od-row { display: flex; }
.ac-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp2); font-size: var(--fs-xs); color: var(--tx2); }
.spark { display: block; color: var(--ac); }

/* states */
.state { display: grid; justify-items: center; text-align: center; gap: var(--sp2); padding: var(--sp8) var(--sp4); border: 1px dashed var(--bd2); border-radius: var(--r2); }
.state > * { display: block; }
.state p { max-width: 44ch; }
.state .btn { display: inline-flex; }
.state-err { border-style: solid; border-color: color-mix(in srgb, var(--bad) 40%, var(--bd)); }
.state-err > .ic { color: var(--bad); }
.state code { color: var(--tx2); font-size: var(--fs-xs); overflow-wrap: anywhere; }
.illus { width: 120px; height: 80px; color: var(--tx2); }
.illus .a { stroke: var(--ac); }
.skel-list { border: 1px solid var(--bd); border-radius: var(--r2); background: var(--s1); }
.skel-row { display: flex; gap: var(--sp4); align-items: center; padding: 0 var(--sp3); height: 40px; }
.skel-row + .skel-row { border-top: 1px solid var(--bd); }
.skel { display: block; height: 10px; border-radius: 4px; background: linear-gradient(90deg, var(--s2) 0%, var(--s3) 50%, var(--s2) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.w15 { width: 15%; } .w30 { width: 30%; } .w50 { width: 50%; }

/* stepper */
.stepper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--sp2); list-style: none; margin: 0; padding: 0; }
.step { display: grid; gap: 2px; padding: var(--sp2) var(--sp3); border: 1px solid var(--bd); border-radius: var(--r2); background: var(--s1); position: relative; }
.step > * { display: block; }
.step-h { display: flex !important; align-items: center; gap: 6px; font-weight: 500; font-size: var(--fs-sm); }
.step-d { font-family: var(--f-mono); font-size: var(--fs-xs); color: var(--tx2); }
.step.ok .step-h .ic { color: var(--ok); }
.step.run { border-color: color-mix(in srgb, var(--busy) 50%, var(--bd)); }
.step.run .step-h .ic { color: var(--busy); }
.step.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--bd)); background: var(--bad-soft); }
.step.bad .step-h .ic { color: var(--bad); }
.step.skip { opacity: .6; }
.step::after { content: ''; position: absolute; top: 50%; right: -9px; width: 10px; height: 1px; background: var(--bd2); }
.step:last-child::after { display: none; }

/* logs */
.log-tools { display: flex; align-items: center; gap: var(--sp2); flex-wrap: wrap; }
.log-tools input[type=search] { flex: 1 1 200px; }
.log { background: var(--code-bg); border: 1px solid var(--bd); border-radius: var(--r2); font-family: var(--f-mono); font-size: var(--fs-xs); line-height: 1.7; max-height: 62vh; overflow: auto; }
.log-group > summary { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: var(--sp2); padding: 6px var(--sp3); cursor: pointer; list-style: none; background: var(--s2); border-bottom: 1px solid var(--bd); font-family: var(--f-ui); font-size: var(--fs-sm); font-weight: 500; }
.log-group > summary::-webkit-details-marker { display: none; }
.log-group > summary .grow { flex: 1 1 0; }
.log-group > summary .chev { transition: transform var(--dur) var(--ease-out); }
.log-group[open] > summary .chev { transform: rotate(90deg); }
.log-lines { padding: var(--sp2) 0; }
.ln { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: var(--sp3); padding: 0 var(--sp3); }
.ln > * { display: block; }
.ln .ts { color: var(--tx2); user-select: none; }
.ln .t { white-space: pre-wrap; overflow-wrap: anywhere; }
.ln.err { background: var(--bad-soft); } .ln.err .t { color: var(--bad); }
.ln.warn .t { color: var(--busy); }
.ln.dim .t { color: var(--tx2); }
.ln mark { background: color-mix(in srgb, var(--busy) 35%, transparent); color: inherit; border-radius: 2px; }
.log-empty { padding: var(--sp4); color: var(--tx2); font-family: var(--f-ui); }

/* terminal */
.term { display: flex; flex-direction: column; min-height: calc(100vh - 300px); background: #070A0E; color: #D6DEE6; border: 1px solid var(--bd); border-radius: var(--r2); overflow: hidden; }
.term:fullscreen { border-radius: 0; }
.term-bar { display: flex; align-items: center; gap: var(--sp3); padding: var(--sp1) var(--sp1) var(--sp1) var(--sp3); border-bottom: 1px solid #1F2A36; font-size: var(--fs-xs); color: #8B98A5; }
.term-bar .grow { flex: 1 1 0; }
.term-bar .btn-icon { color: #8B98A5; }
.term-out { flex: 1 1 auto; overflow: auto; padding: var(--sp3); font-family: var(--f-mono); font-size: var(--fs-sm); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 0; }
.term-out .ps { color: #5CC8E6; }
.term-out .ok { color: #3FB950; }
.term-in { display: flex; align-items: center; gap: var(--sp2); padding: var(--sp2) var(--sp3); border-top: 1px solid #1F2A36; font-family: var(--f-mono); font-size: var(--fs-sm); }
.term-in .ps { color: #5CC8E6; white-space: nowrap; }
.term-in input { flex: 1 1 0; background: transparent; border: 0; height: 28px; padding: 0; color: #E6EDF3; font-family: var(--f-mono); }
.term-in input:focus { box-shadow: none; }

/* layers */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; animation: fade var(--dur) var(--ease-out); }
@keyframes fade { from { opacity: 0; } }
.ov-modal { align-items: flex-start; justify-content: center; padding: 10vh var(--sp4) var(--sp4); overflow-y: auto; }
.ov-panel { justify-content: flex-end; }
.ov-palette { align-items: flex-start; justify-content: center; padding: 12vh var(--sp4) var(--sp4); }
.modal { width: 100%; max-width: 560px; background: var(--s1); border: 1px solid var(--bd2); border-radius: var(--r2); box-shadow: 0 16px 48px rgba(0, 0, 0, .35); animation: rise var(--dur) var(--ease-out); }
.modal.wide { max-width: 720px; }
.panel { width: min(520px, 100%); height: 100%; overflow-y: auto; background: var(--s1); border-left: 1px solid var(--bd2); display: flex; flex-direction: column; animation: slide var(--dur) var(--ease-out); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.m-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp3); padding: var(--sp4) var(--sp4) var(--sp3); }
.m-head > div { display: grid; gap: 2px; }
.m-head > div > * { display: block; }
.m-head p { font-size: var(--fs-sm); }
.m-body { padding: 0 var(--sp4) var(--sp4); display: flex; flex-direction: column; gap: var(--sp4); }
.panel .m-body { flex: 1 1 auto; }
.m-foot { display: flex; justify-content: flex-end; gap: var(--sp2); padding: var(--sp3) var(--sp4); border-top: 1px solid var(--bd); background: var(--s1); }
.panel .m-foot { position: sticky; bottom: 0; margin-top: auto; }
.panel form > .m-foot { margin: auto calc(-1 * var(--sp4)) calc(-1 * var(--sp4)); }
.config-box { padding: var(--sp3); border: 1px solid var(--bd); border-radius: var(--r1); background: var(--s2); font-size: var(--fs-sm); }
.cfg { display: flex; align-items: center; gap: var(--sp2); flex-wrap: wrap; }
.cfg.ok .ic { color: var(--ok); }

.progress { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp1); }
.progress li { display: flex; align-items: center; gap: var(--sp3); padding: var(--sp2) var(--sp3); border-radius: var(--r1); font-size: var(--fs-sm); color: var(--tx2); }
.progress li .grow { flex: 1 1 0; }
.progress li.ok { color: var(--tx); } .progress li.ok > .ic { color: var(--ok); }
.progress li.run { color: var(--tx); background: var(--busy-soft); } .progress li.run > .ic { color: var(--busy); }
.pending-ring { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--bd2); flex: none; }

.palette { width: 100%; max-width: 620px; background: var(--s1); border: 1px solid var(--bd2); border-radius: var(--r2); box-shadow: 0 16px 48px rgba(0, 0, 0, .4); overflow: hidden; animation: rise var(--dur) var(--ease-out); }
.pal-in { display: flex; align-items: center; gap: var(--sp2); padding: 0 var(--sp4); border-bottom: 1px solid var(--bd); }
.pal-in input { flex: 1 1 0; height: 48px; border: 0; background: transparent; padding: 0; font-size: var(--fs-md); }
.pal-in input:focus { box-shadow: none; }
.pal-list { max-height: 52vh; overflow-y: auto; padding: var(--sp1); list-style: none; margin: 0; }
.pal-group { padding: var(--sp2) var(--sp3) var(--sp1); font-size: var(--fs-xs); color: var(--tx2); font-weight: 500; }
.pal-item { display: flex; align-items: center; gap: var(--sp3); height: 38px; padding: 0 var(--sp3); border-radius: var(--r1); cursor: pointer; color: var(--tx); }
.pal-item .grow { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-item .hint { color: var(--tx2); font-size: var(--fs-xs); white-space: nowrap; }
.pal-item[aria-selected="true"] { background: var(--s3); }
.pal-item[aria-selected="true"] > .ic { color: var(--ac); }
.pal-foot { display: flex; gap: var(--sp4); padding: var(--sp2) var(--sp4); border-top: 1px solid var(--bd); font-size: var(--fs-xs); color: var(--tx2); }
.pal-empty { padding: var(--sp6); text-align: center; color: var(--tx2); }

#toasts { position: fixed; right: var(--sp4); bottom: var(--sp4); z-index: 70; display: flex; flex-direction: column; gap: var(--sp2); pointer-events: none; }
.toast { display: flex; align-items: center; gap: var(--sp2); padding: var(--sp2) var(--sp3); background: var(--s2); border: 1px solid var(--bd2); border-radius: var(--r2); font-size: var(--fs-sm); box-shadow: 0 8px 24px rgba(0, 0, 0, .3); animation: rise var(--dur) var(--ease-out); max-width: 360px; pointer-events: auto; }
.toast .ic { color: var(--ok); }
.toast.bad .ic { color: var(--bad); }
.toast.out { opacity: 0; transform: translateY(4px); transition: opacity var(--dur-out) var(--ease-in), transform var(--dur-out) var(--ease-in); }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--bd); stroke-width: 1; }
.chart .ax { fill: var(--tx2); font: 10px var(--f-mono); }
.chart .ln-a { fill: none; stroke: var(--ac); stroke-width: 1.5; }
.chart .ar-a { fill: var(--ac-soft); }
.chart .gap { fill: var(--bad-soft); }

/* integrations */
.int-card { display: flex; flex-direction: column; gap: var(--sp3); padding: var(--sp3); }
.int-h { display: flex; align-items: center; gap: var(--sp3); }
.int-h .logo { width: 36px; height: 36px; display: grid; place-items: center; border-radius: var(--r1); background: var(--s2); border: 1px solid var(--bd); flex: none; }
.int-h .logo .ic { width: 20px; height: 20px; }
.int-h > div { display: grid; flex: 1 1 0; min-width: 0; }
.int-h > div > * { display: block; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--sp1) var(--sp4); font-size: var(--fs-sm); margin: 0; }
.kv dt { color: var(--tx2); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.setup-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp3); }
.setup-step { display: flex; align-items: center; gap: var(--sp3); padding: var(--sp3); }
.setup-step .num { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--bd2); display: grid; place-items: center; flex: none; font-weight: 600; font-size: var(--fs-sm); color: var(--tx2); }
.setup-step.done .num { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.setup-step > div { flex: 1 1 0; display: grid; gap: 2px; min-width: 0; }
.setup-step > div > * { display: block; }
.setup-step.done h3 { color: var(--tx2); text-decoration: line-through; }

.radio-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp3); }
.radio-card { display: grid; gap: var(--sp1); padding: var(--sp3); border: 1px solid var(--bd2); border-radius: var(--r2); cursor: pointer; background: var(--s1); }
.radio-card > * { display: block; }
.radio-card:has(input:checked) { border-color: var(--ac); background: var(--ac-soft); }
.radio-card:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.radio-card .rc-h { display: flex; align-items: center; gap: var(--sp2); font-weight: 500; }
.secret { letter-spacing: .1em; color: var(--tx2); }

.scrim { display: none; }

/* responsive */
@media (max-width: 1100px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols-2 { grid-template-columns: minmax(0, 1fr); }
  .hide-md { display: none; }
  .stepper { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .step::after { display: none; }
}
@media (max-width: 767px) {
  .app, body.sb-collapsed .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; left: 0; top: 0; z-index: 40; width: 272px; transform: translateX(-100%); transition: transform var(--dur-out) var(--ease-in); }
  body.drawer-open .sidebar { transform: none; transition: transform var(--dur) var(--ease-out); }
  body.drawer-open .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: var(--scrim); }
  body.sb-collapsed .lbl { display: revert; }
  body.sb-collapsed .sb-env { display: block; }
  .sb-collapse { display: none !important; }
  .menu-btn { display: inline-grid; }
  .topbar { padding: 0 var(--sp3); }

function parse() {
  const raw = S.hash.replace(/^#\/?/, '') || 'overview';
  const [p, qs = ''] = raw.split('?');
  return { parts: p.split('/').filter(Boolean).map(decodeURIComponent), q: new URLSearchParams(qs) };
}
function route() {
  clearTimers();
  const { parts, q } = parse();
  const [sec, id, tab] = parts;
  let v;
  switch (sec) {
    case 'overview': v = vOverview(q); break;
    case 'workspaces': v = id ? vWorkspace(id, tab) : vWorkspaces(q); break;
    case 'apps': v = id ? vApp(id, tab) : vApps(q); break;
    case 'deployments': v = id ? vDeployment(id) : vDeployments(q); break;
    case 'nodes': v = id ? vNode(id) : vNodes(q); break;
    case 'integrations': v = vIntegrations(); break;
    case 'settings': v = vSettings(id); break;
    case 'welcome': v = vWelcome(); break;
    case 'profile': v = vProfile(); break;
    default: v = vNotFound();
  }
  S.view = { sec, id, tab };
  $('#view').innerHTML = `<div class="content">${v.html}</div>`;
  renderTop(v);
  $$('#sidebar [data-sec]').forEach(a => a.dataset.sec === sec ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  document.title = `${v.title} · walroos`;
  if (v.mount) v.mount();
}
function refresh(secs) { if (secs.includes(S.view.sec) && !$('#layer').innerHTML) route(); }

function openLayer(html, kind = 'modal', label = 'Dialog', wide = false) {
  if (!$('#layer').innerHTML) S.lastFocus = document.activeElement;
  closeMenus();
  S.layerTimers.forEach(clearTimeout); S.layerTimers = [];
  $('#layer').innerHTML = `<div class="overlay ov-${kind}" data-act="closeLayerBg"><div class="${kind}${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div></div>`;
  requestAnimationFrame(() => { const f = $('#layer [autofocus]') || $('#layer input:not([type=hidden]):not([type=radio]), #layer textarea, #layer select') || $('#layer button'); if (f) f.focus(); });
}
function closeLayer() {
  S.layerTimers.forEach(clearTimeout); S.layerTimers = [];
  if (!$('#layer').innerHTML) return;
  $('#layer').innerHTML = '';
  if (S.lastFocus && document.contains(S.lastFocus)) S.lastFocus.focus();
  S.lastFocus = null;
}
function confirmModal({ title, body, confirm, danger, onConfirm }) {
  openLayer(`${modalHead(title)}<div class="m-body"><p class="muted">${body}</p></div><div class="m-foot"><button class="btn" data-act="closeLayer">Cancel</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="confirm-btn" autofocus>${confirm}</button></div>`, 'modal', title);
  S.onConfirm = onConfirm;
}
function toast(text, kind = 'ok') {
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  t.innerHTML = `${icon(kind === 'bad' ? 'alert' : 'check')}<span>${esc(text)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 120); }, kind === 'bad' ? 4200 : 2400);
}
function closeMenus(except) { $$('details.menu[open]').forEach(d => { if (d !== except) d.open = false; }); }
function placeMenu(det) {
  const pop = det.querySelector('.menu-pop'), sum = det.querySelector('summary');
  const r = sum.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  let left = Math.min(r.right - w, innerWidth - w - 8); left = Math.max(8, left);
  let top = r.bottom + 4; if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 4);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}

function rollbackTarget(a) {
  const latest = deploys.find(d => d.app === a.name && !d.live);
  if (latest && latest.status === 'failed') return deploys.find(d => d.app === a.name && d.current) || null;
  return deploys.find(d => d.app === a.name && d.status === 'succeeded' && !d.current) || null;
}
function doRollback(d, a) {
  deploys.forEach(x => { if (x.app === d.app) x.current = false; });
  d.current = true; a.status = 'running';

  route();
}
function rollbackApp(name) {
  const a = appBy(name), t = a && rollbackTarget(a); if (!t) return;

  confirmModal({
    title: `Roll back ${name}?`,
    body: latest.status === 'failed' ? `Pins <span class="mono">${name}</span> to <span class="sha">${t.sha}</span> (${esc(t.msg)}), the version still serving, and marks <span class="sha">${latest.sha}</span> as rolled back.` : `Routes traffic back to <span class="sha">${t.sha}</span> · ${esc(t.msg)}. The current container is kept for 24h.`,
    confirm: 'Roll back', onConfirm: () => doRollback(t, a),

  delKey: el => { const k = sshKeys[+el.dataset.i]; confirmModal({ title: `Remove ${k.name}?`, body: 'This key can no longer SSH into workspaces. Open sessions stay connected until they close.', confirm: 'Remove key', danger: true, onConfirm: () => { sshKeys.splice(+el.dataset.i, 1); toast('SSH key removed'); route(); } }); },
  createToken: () => openLayer(`${modalHead('Create API token', 'Shown once. Store it in your CI secrets or password manager.')}
    <form class="m-body form" data-form="createToken" novalidate><div class="field"><label for="t-n">Name <span class="req" aria-hidden="true">*</span></label><input id="t-n" name="n" class="mono" placeholder="github-actions-blog" autocomplete="off" required autofocus aria-describedby="t-err"><p class="err" id="t-err" hidden></p></div>
    <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:6px">Scopes</legend><div class="od-cluster" style="--od-gap:16px">${['read', 'deploy', 'workspaces', 'admin'].map((s, i) => `<label class="check"><input type="checkbox" name="scope" value="${s}" ${i < 2 ? 'checked' : ''}>${s}</label>`).join('')}</div></fieldset>
    <div class="m-foot" style="margin:0 -16px -16px"><button type="button" class="btn" data-act="closeLayer">Cancel</button><button class="btn btn-primary" type="submit">Create token</button></div></form>`, 'modal', 'Create API token'),
  revokeToken: el => { const t = tokens[+el.dataset.i]; confirmModal({ title: `Revoke ${t.name}?`, body: 'Anything using this token gets 401 immediately. CI pipelines using it will fail.', confirm: 'Revoke token', danger: true, onConfirm: () => { tokens.splice(+el.dataset.i, 1); toast('Token revoked'); route(); } }); },
  kickSession: el => {
    const list = SESSIONS[el.dataset.ws] || [], s = list[+el.dataset.i]; if (!s) return;
    confirmModal({ title: `Disconnect ${s.user}?`, body: `Closes the ${esc(s.client)} session from <span class="mono">${esc(s.from)}</span>. Unsaved editor buffers on their side may be lost; files in the workspace are kept.`, confirm: 'Disconnect', danger: true, onConfirm: () => { list.splice(+el.dataset.i, 1); toast(`${s.user} disconnected`); route(); } });
  },
  checkUpdates: () => toast('Hub is on 0.9.2, the latest. vps-fra will update when it comes back online.'),
  setupGit: () => openLayer(`${modalHead('Connect GitHub', 'Installs the walroos GitHub App on the repos you choose.')}
    <div class="m-body"><p class="muted" style="font-size:var(--fs-sm)">You'll be sent to github.com to pick repositories, then back here.</p></div>
    <div class="m-foot"><button class="btn" data-act="closeLayer">Cancel</button><button class="btn btn-primary" data-act="setupGitDone" autofocus>${icon('github')}Continue to GitHub</button></div>`, 'modal', 'Connect GitHub'),
  setupGitDone: () => { S.setup.git = true; closeLayer(); toast('GitHub connected · jefjesuswt'); route(); },
};

document.addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]');
  if (cp) { e.preventDefault(); copyText(cp.dataset.copy, cp); return; }
  if (e.target.id === 'confirm-btn') { const fn = S.onConfirm; S.onConfirm = null; closeLayer(); if (fn) fn(); return; }
  const link = e.target.closest('a[href^="#/"]');
  if (link && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); go(link.getAttribute('href')); return; }
  const pal = e.target.closest('[data-pal]');
  if (pal) { runPalette(+pal.dataset.pal); return; }
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) { if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault(); ACT[el.dataset.act](el, e); return; }
  const card = e.target.closest('[data-href]');
  if (card && !e.target.closest('a, button, input, select, summary')) { go(card.dataset.href); return; }
  const det = e.target.closest('details.menu');
  closeMenus(det);
});
document.addEventListener('toggle', e => {
  const t = e.target;
  if (t.matches && t.matches('details.menu') && t.open) { closeMenus(t); placeMenu(t); const f = t.querySelector('.menu-pop button, .menu-pop input, .menu-pop a'); if (f) f.focus({ preventScroll: true }); }
  if (t.matches && t.matches('details[data-step]')) S.collapsed[t.dataset.step] = !t.open;
  if (t.matches && t.matches('details[data-acc]')) { if (t.open) S.acc.add(t.dataset.acc); else S.acc.delete(t.dataset.acc); }
}, true);
addEventListener('scroll', () => closeMenus(), { passive: true });
addEventListener('resize', () => closeMenus());

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#layer .palette') ? closeLayer() : openPalette(); return; }
  if (e.key === '[' && !e.metaKey && !e.ctrlKey && !(e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) && !$('#layer').innerHTML) { ACT.toggleSidebar(); return; }
  if (e.key === 'Escape') {
    const open = $('details.menu[open]');
    if (open) { open.open = false; open.querySelector('summary').focus(); return; }
    if ($('#layer').innerHTML) { closeLayer(); return; }
    if (document.body.classList.contains('drawer-open')) { closeDrawer(); $('.menu-btn').focus(); }
    return;
  }
  if (e.target.id === 'pal-q' && S.pal) {
    const n = S.pal.shown.length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); S.pal.sel = (S.pal.sel + 1) % n; paintPalette(e.target.value); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); S.pal.sel = (S.pal.sel - 1 + n) % n; paintPalette(e.target.value); }
    else if (e.key === 'Enter') { e.preventDefault(); runPalette(S.pal.sel); }
  }
  if (e.key === 'Tab' && $('#layer').innerHTML) { // keep focus inside the dialog
    const f = $$('#layer button:not([disabled]), #layer a[href], #layer input, #layer select, #layer textarea, #layer summary').filter(x => x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pal-q') { S.pal.sel = 0; paintPalette(t.value); }
  else if (t.id === 'rt-q') { S.rtFilter = t.value; paintRuntime(S.view.id); }
  else if (t.id === 'log-q') { S.logQuery = t.value; const d = depBy(S.view.id); if (d) paintDeploy(d); }
  else if (t.id === 'nw-repo') { $('#nw-config').innerHTML = configBox(REPO_RE.test(t.value.trim()) ? t.value : ''); if (t.getAttribute('aria-invalid') === 'true') validateRepo(t); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.filter === 'node') { S.nodeFilter = t.value; route(); }
  else if (t.dataset.filter === 'app') { S.depFilter.app = t.value; route(); }
  else if (t.dataset.filter === 'status') { S.depFilter.status = t.value; route(); }
  else if (t.id === 'rt-lv') { S.rtLevel = t.value; paintRuntime(S.view.id); }
  else if (t.id === 'log-auto') S.autoscroll = t.checked;
  else if (t.name === 'trigger' && t.dataset.app) { const a = appBy(t.dataset.app); a.trigger = t.value; toast(`${a.name}: trigger set to ${APP_TRIG[t.value]}`); route(); }
});
document.addEventListener('focusout', e => { if (e.target.id === 'nw-repo' && e.target.value) validateRepo(e.target); });

function fieldErr(id, msg, input) { const el = $('#' + id); el.hidden = !msg; el.textContent = msg; if (input) { input.setAttribute('aria-invalid', msg ? 'true' : 'false'); if (msg) input.focus(); } return !msg; }
document.addEventListener('submit', e => {
  const f = e.target, kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  if (kind === 'newWs') { if (!validateRepo(f.repo)) { f.repo.focus(); return; } runCreateWorkspace(f); }
  else if (kind === 'newApp') {
    const repo = f.repo.value.trim();
    if (!fieldErr('na-repo-err', !repo ? 'Repository URL is required.' : !REPO_RE.test(repo) ? 'Use host/owner/repo, like github.com/jefjesuswt/landing.' : '', f.repo)) return;
    const clean = repo.replace(/^https?:\/\//, '').replace(/\.git$/, '').replace(/\/$/, '');
    let name = clean.split('/').pop(); if (appBy(name)) name = `${name}-2`;
    const domain = f.domain.value.trim() || `${name}.walroos.com`;
    apps.push({ name, repo: clean, node: f.node.value, domain, trigger: f.trigger.value, status: 'running', port: 3000, health: '/health', dockerfile: './Dockerfile', spark: Array(14).fill(0) });
    envs[name] = [['PORT', '3000', 0]]; domains[name] = [[domain, 'Cloudflare Tunnel', 'pending']];
    closeLayer();
    setTimeout(() => { domains[name][0][2] = 'active'; }, 3000);
    deployAndOpen(name, 'main');
  }
  else if (kind === 'deployRef') { closeMenus(); deployAndOpen(f.dataset.app, f.ref.value.trim() || 'main'); }
  else if (kind === 'term') {
    const input = f.querySelector('input'), c = input.value.trim(), w = wsBy(f.dataset.name); input.value = '';
    const buf = S.term[w.name], ps = `<span class="ps">jef@${esc(w.name)}:/workspaces/${esc(w.name)}$</span> ${esc(c)}`;
    if (c === 'clear') { buf.length = 0; }
    else { buf.push(ps); if (c) { const out = TERM_OUT(w)[c]; buf.push(out != null ? esc(out) : c === 'claude' ? 'Claude Code needs a TTY — run: ssh ' + esc(w.name) + '.walroos -t claude' : `bash: ${esc(c.split(' ')[0])}: command not found`); } }
    const o = $('#term-out'); o.innerHTML = buf.join('\n'); o.scrollTop = o.scrollHeight;
  }
  else if (kind === 'wsRes') { const w = wsBy(f.dataset.name); w.cpu = +f.cpu.value; w.mem = +f.mem.value; toast(`Limits saved · ${w.cpu} vCPU, ${w.mem} GB — restart to apply`); }
  else if (kind === 'addEnv') {
    const k = f.k.value.trim().toUpperCase(), v = f.v.value;
    if (!fieldErr('env-err', !/^[A-Z_][A-Z0-9_]*$/.test(k) ? 'Key must be letters, digits and underscores, not starting with a digit.' : !v ? 'Value is required.' : '', !/^[A-Z_][A-Z0-9_]*$/.test(k) ? f.k : f.v)) return;
    const rows = envs[f.dataset.app], ex = rows.find(r => r[0] === k);
    if (ex) { ex[1] = v; ex[2] = f.s.checked ? 1 : 0; } else rows.push([k, v, f.s.checked ? 1 : 0]);
    toast(`${k} saved · redeploy to apply`); route();
  }
  else if (kind === 'importEnv') {
    const rows = envs[f.dataset.app]; let n = 0;
    f.t.value.split(/\r?\n/).forEach(line => {
      const m = /^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$/.exec(line); if (!m || line.trim().startsWith('#')) return;
      const k = m[1].toUpperCase(), v = m[2].replace(/^(['"])(.*)\1$/, '$2'), s = f.auto.checked && /SECRET|KEY|TOKEN|PASSWORD/.test(k) ? 1 : 0;
      const ex = rows.find(r => r[0] === k); if (ex) { ex[1] = v; ex[2] = s || ex[2]; } else rows.push([k, v, s]); n++;
    });
    if (!n) { fieldErr('ie-err', 'No KEY=VALUE lines found.', f.t); return; }
    closeLayer(); toast(`Imported ${n} variable${n === 1 ? '' : 's'} · redeploy to apply`); route();
  }
  else if (kind === 'addDomain') {
    const d = f.d.value.trim().toLowerCase();
    if (!fieldErr('dm-err', !/^([a-z0-9-]+\.)+[a-z]{2,}$/.test(d) ? 'Enter a hostname like status.walroos.com.' : (domains[f.dataset.app] || []).some(r => r[0] === d) ? 'That domain is already attached.' : '', f.d)) return;
    const row = [d, f.i.value, 'pending']; domains[f.dataset.app].push(row); route();
    toast(`${d}: creating DNS record…`);
    setTimeout(() => { row[2] = 'active'; if (S.view.tab === 'domains') route(); }, 2500);
  }
  else if (kind === 'build') {
    const port = f.port.value.trim(), hp = f.health.value.trim();
    if (!fieldErr('b-err', !/^\d{2,5}$/.test(port) ? 'Port must be a number, e.g. 3000.' : !hp.startsWith('/') ? 'Healthcheck path must start with /.' : '', !/^\d{2,5}$/.test(port) ? f.port : f.health)) return;
    const a = appBy(f.dataset.app); a.dockerfile = f.dockerfile.value.trim() || './Dockerfile'; a.port = +port; a.health = hp; deploys.forEach(d => { if (d.app === a.name) d._steps = null; });
    toast('Build settings saved · applied on next deploy');
  }
  else if (kind === 'connectInt') {
    const k = f.dataset.k;
    if (!fieldErr(`i-${k}-err`, f.tok.value.trim().length < 8 ? 'Paste a personal access token (at least 8 characters).' : '', f.tok)) return;
    const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.innerHTML = `${icon('refresh', 'spin')}Connecting…`;
    setTimeout(() => { Object.assign(integrations[k], { connected: true, account: 'jefjesuswt', url: f.url.value.trim(), repos: 3, via: 'Access token' }); toast(`${integrations[k].name} connected`); refresh(['integrations']); }, 900);
  }
  else if (kind === 'addKey') {
    const key = f.k.value.trim();
    if (!fieldErr('k-err', !/^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp\d+|sk-ssh-ed25519@openssh\.com) [A-Za-z0-9+/=]{16,}/.test(key) ? 'That doesn\'t look like an OpenSSH public key. It starts with ssh-ed25519, ssh-rsa or ecdsa-sha2-….' : '', f.k)) return;
    sshKeys.push({ name: f.n.value.trim() || key.split(' ')[2] || 'new-key', type: key.split(' ')[0].replace('ssh-', '').toUpperCase(), fp: 'SHA256:' + btoa(key.slice(-24)).slice(0, 32), added: 'today', last: 'never' });
    closeLayer(); toast('SSH key added'); route();
  }
  else if (kind === 'profile') {
    const name = f.dname.value.trim();
    if (!name) { f.dname.focus(); toast('Display name can\'t be empty', 'bad'); return; }
    Object.assign(S.profile, { name, tz: f.tz.value, node: f.node.value });
    renderShell(); route(); toast('Profile saved');
  }
  else if (kind === 'createToken') {
    const name = f.n.value.trim(), scopes = $$('input[name=scope]:checked', f).map(x => x.value);
    if (!fieldErr('t-err', !name ? 'Give the token a name so you know where it lives.' : !scopes.length ? 'Pick at least one scope.' : '', f.n)) return;
    const secret = 'wlr_pat_' + Array.from({ length: 4 }, hex7).join('').slice(0, 28);
    tokens.unshift({ name, scopes, last: 'never', created: 'today' });
    $('#layer .modal').innerHTML = `${modalHead('Token created', 'Copy it now. You won\'t see it again.')}<div class="m-body">${cmd(secret, '')}<div class="alert alert-busy">${icon('alert')}<div class="alert-text"><strong>Shown once</strong><span class="muted">walroos stores only a hash of this token.</span></div></div></div><div class="m-foot"><button class="btn btn-primary" data-act="closeLayer" autofocus>Done</button></div>`;
    $('#layer .m-foot .btn').focus();
    if (S.view.sec === 'settings') { const keep = $('#layer').innerHTML; route(); $('#layer').innerHTML = keep; $('#layer .m-foot .btn').focus(); }
  }
});

/* ---------- boot ---------- */
if (document.documentElement.classList.contains('pre-collapsed')) document.body.classList.add('sb-collapsed');
renderShell();
// ponytail: in-memory router; the URL hash is mirrored only when the host allows it (sandboxed srcdoc previews don't)
function go(h) {
  S.hash = h;
  try { if (location.hash !== h) history.pushState(null, '', h); } catch (e) { /* preview iframe: keep in-memory route */ }
  closeLayer(); closeDrawer(); route(); scrollTo(0, 0); $('#view').focus({ preventScroll: true });
}
const readHash = () => { try { return location.hash.startsWith('#/') ? location.hash : ''; } catch (e) { return ''; } };
addEventListener('hashchange', () => { const h = readHash(); if (h && h !== S.hash) go(h); });
addEventListener('popstate', () => { const h = readHash(); if (h && h !== S.hash) go(h); });
S.hash = readHash() || '#/overview';
route();

</script>
</body>
</html>
